name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # KOReader runs on LuaJIT; plain Lua 5.1 and 5.4 catch version-specific slips
        lua: [luajit, lua5.1, lua5.4]
    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.lua }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.lua }}

      - name: Check syntax
        run: |
          for f in kavitahl.koplugin/*.lua; do
            ${{ matrix.lua }} -e "assert(loadfile('$f'))" || exit 1
          done

      - name: Run tests
        working-directory: tests
        run: |
          status=0
          for f in test_*.lua; do
            echo "::group::$f"
            ${{ matrix.lua }} "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
